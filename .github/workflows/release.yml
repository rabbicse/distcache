name: Release

# Pushing a tag like v1.2.0 tests the tree, builds the archives for every
# platform, attaches them to a GitHub release and publishes the
# multi-architecture container image to the GitHub Container Registry.
on:
  push:
    tags: ["v*"]

permissions:
  contents: write
  packages: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: 1.27.x
      - name: Test
        run: |
          make test
          make test-e2e
      - name: Build archives
        run: VERSION="${GITHUB_REF_NAME#v}" make dist
      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" dist/* --title "DistCache ${GITHUB_REF_NAME#v}" --generate-notes
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}
      - name: Publish container image
        run: |
          version="${GITHUB_REF_NAME#v}"
          image="ghcr.io/${GITHUB_REPOSITORY,,}"
          docker buildx build --platform linux/amd64,linux/arm64 \
            -f deploy/docker/Dockerfile --build-arg VERSION="$version" \
            -t "$image:$version" -t "$image:latest" --push .
