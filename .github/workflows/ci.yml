name: CI

on:
  push:
    branches: [master]
  pull_request:

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: 1.27.x
      # Pinned and built with the module's toolchain so it can lint Go 1.27 code.
      - name: Install golangci-lint
        run: GOTOOLCHAIN=go1.27.3 CGO_ENABLED=0 go install github.com/golangci/golangci-lint/v2/cmd/golangci-lint@v2.15.0
      - name: Lint
        run: golangci-lint run ./...
      - name: Command reference is up to date
        run: |
          make docs-commands
          git diff --exit-code docs/commands.md

  test-linux:
    runs-on: ubuntu-latest
    services:
      redis:
        image: redis:8.4
        ports:
          - 6379:6379
    env:
      REDIS_SERVER_ADDR: 127.0.0.1:6379
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: 1.27.x
      - run: make test
      - run: make test-e2e
      - run: make cover
      - uses: actions/upload-artifact@v4
        with:
          name: coverage
          path: coverage.out

  test-other:
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: 1.27.x
      - name: Test (macOS)
        if: matrix.os == 'macos-latest'
        run: |
          make test
          make test-e2e
      - name: Build and vet (Windows)
        if: matrix.os == 'windows-latest'
        shell: bash
        run: |
          go build ./...
          go vet ./...
      # Windows binaries are shipped as a preview. The tests run so problems
      # are visible, but they do not block a merge yet.
      - name: Test (Windows, informational)
        if: matrix.os == 'windows-latest'
        continue-on-error: true
        shell: bash
        run: go test -count=1 ./...

  package:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: 1.27.x
      - name: Release archives build for every platform
        run: make dist
      - name: Container image builds and answers
        run: |
          make docker
          docker run -d --name dc -p 6379:6379 distcache:dev
          make build
          for i in $(seq 1 20); do
            if bin/distcache-bench -p 6379 -c 1 -n 1 -t ping -q; then exit 0; fi
            sleep 0.5
          done
          docker logs dc
          exit 1
      - name: Kubernetes manifests render
        run: |
          kubectl kustomize deploy/kubernetes/base >/dev/null
          kubectl kustomize deploy/kubernetes/overlays/replication >/dev/null
