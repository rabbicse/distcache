name: CI

on:
  push:
  pull_request:

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    services:
      # Service containers are only supported on Linux runners; the other
      # matrix entries get an empty services block.
      redis:
        image: ${{ matrix.os == 'ubuntu-latest' && 'redis:8.4' || '' }}
        ports:
          - 6379:6379
    env:
      REDIS_SERVER_ADDR: ${{ matrix.os == 'ubuntu-latest' && '127.0.0.1:6379' || '' }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: 1.27.x

      - name: Lint
        if: matrix.os == 'ubuntu-latest'
        uses: golangci/golangci-lint-action@v8
        with:
          version: latest

      - name: Vet and test (Windows)
        if: matrix.os == 'windows-latest'
        shell: bash
        run: |
          go vet ./...
          go test -race -count=1 ./...

      - name: Test
        if: matrix.os != 'windows-latest'
        run: make test

      - name: Test e2e
        if: matrix.os != 'windows-latest'
        run: make test-e2e

      - name: Coverage
        if: matrix.os == 'ubuntu-latest'
        run: make cover

      - name: Upload coverage
        if: matrix.os == 'ubuntu-latest'
        uses: actions/upload-artifact@v4
        with:
          name: coverage
          path: coverage.out
