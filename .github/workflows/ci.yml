name: CI

on:
  push:
    branches: [master]
  pull_request:

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: 1.27.x
      # Pinned and built with the module's toolchain so it can lint Go 1.27 code.
      - name: Install golangci-lint
        run: GOTOOLCHAIN=go1.27.3 CGO_ENABLED=0 go install github.com/golangci/golangci-lint/v2/cmd/golangci-lint@v2.15.0
      - name: Lint
        run: golangci-lint run ./...

  test-linux:
    runs-on: ubuntu-latest
    services:
      redis:
        image: redis:8.4
        ports:
          - 6379:6379
    env:
      REDIS_SERVER_ADDR: 127.0.0.1:6379
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: 1.27.x
      - run: make test
      - run: make test-e2e
      - run: make cover
      - uses: actions/upload-artifact@v4
        with:
          name: coverage
          path: coverage.out

  test-other:
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: 1.27.x
      - name: Test (macOS)
        if: matrix.os == 'macos-latest'
        run: |
          make test
          make test-e2e
      # Windows has no make; scripts/test.ps1 comes in a later task.
      - name: Vet and test (Windows)
        if: matrix.os == 'windows-latest'
        shell: bash
        run: |
          go vet ./...
          go test -race -count=1 ./...
