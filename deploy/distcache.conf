# DistCache sample configuration.
#
#   distcache-server /path/to/distcache.conf
#   distcache-server /path/to/distcache.conf --port 6380     (arguments win)
#
# The format is the same as redis.conf: one "name value" per line, "#" starts
# a comment. Every setting can also be given on the command line as
# "--name value". Most Redis directives that DistCache does not implement are
# accepted and ignored, so an existing redis.conf usually loads unchanged.
# CONFIG GET reads a setting at runtime; CONFIG SET changes the ones that can
# change while the server runs.

################################ NETWORK ################################

# Interfaces to listen on. The default is every interface.
# For a server only local programs use, bind to loopback:
#   bind 127.0.0.1
bind 0.0.0.0
port 6379

# Optional Unix socket for clients on the same machine (faster than TCP).
# unixsocket /run/distcache/distcache.sock

# Protected mode: with no password set, only loopback clients are served.
# Set a password (below) before exposing the port, or turn this off inside a
# private network you trust.
protected-mode yes

# Close a client after this many idle seconds (0 = never).
timeout 0
tcp-keepalive 300
maxclients 10000

################################ SECURITY ###############################

# Password clients must send with AUTH (or HELLO ... AUTH). Unset by default.
# requirepass change-me-to-a-long-random-string

# "dir" and "dbfilename" cannot be changed with CONFIG SET unless this is
# "yes" (or "local" for loopback connections only).
enable-protected-configs no

################################ GENERAL ################################

# debug, verbose, notice, warning
loglevel notice
# Empty logs to standard output.
logfile ""
databases 16

# Number of keyspace shards (a power of two). Commands on different shards
# run in parallel. Fixed at startup.
shards 256

################################ MEMORY #################################

# 0 means no limit. Accepts units: 512mb, 4gb ...
maxmemory 0
# noeviction, allkeys-lru, allkeys-lfu, allkeys-random,
# volatile-lru, volatile-lfu, volatile-random, volatile-ttl
maxmemory-policy noeviction
maxmemory-samples 5

################################ SNAPSHOTS ##############################

# Directory for the snapshot and the append-only file.
dir ./
# Snapshot file. The format is DistCache's own (DCSNAP); it is not an RDB file.
dbfilename dump.dcs
# "save <seconds> <changes>": snapshot if that many keys changed in that time.
# 'save ""' turns automatic snapshots off.
save 3600 1 300 100 60 10000
stop-writes-on-bgsave-error yes

################################ APPEND-ONLY FILE #######################

# Log every write so nothing acknowledged is lost on a crash.
appendonly no
appendfilename appendonly.aof
# always   : fsync before replying (safest, slowest)
# everysec : fsync once a second (may lose up to one second on a crash)
# no       : let the operating system decide
appendfsync everysec
# The AOF is compacted with BGREWRITEAOF. Automatic rewrite is not
# implemented yet: schedule it (for example from cron) on write-heavy servers.

################################ REPLICATION ############################

# Make this server a read-only copy of another DistCache.
# replicaof 10.0.0.5 6379
# masterauth the-master-password
replica-read-only yes
repl-backlog-size 1mb

################################ LIMITS #################################

proto-max-bulk-len 512mb
# Messages a pub/sub subscriber may have queued before it is disconnected.
pubsub-max-queued-messages 100000
# Milliseconds before a running Lua script makes the server answer BUSY.
lua-time-limit 5000
slowlog-log-slower-than 10000
slowlog-max-len 128

################################ EVENTS #################################

# Keyspace notifications, as in Redis ("KEA" enables everything).
notify-keyspace-events ""
