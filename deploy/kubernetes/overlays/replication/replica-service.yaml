apiVersion: v1
kind: Service
metadata:
  name: distcache-replica
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/component: replica
  ports:
    - name: resp
      port: 6379
      targetPort: resp
---
apiVersion: v1
kind: Service
metadata:
  name: distcache-replica-headless
spec:
  clusterIP: None
  selector:
    app.kubernetes.io/component: replica
  ports:
    - name: resp
      port: 6379
      targetPort: resp
