# Clients connect to distcache:6379. The headless Service gives each pod a
# stable DNS name (distcache-0.distcache-headless), which replicas use to
# find the primary.
apiVersion: v1
kind: Service
metadata:
  name: distcache
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/component: primary
  ports:
    - name: resp
      port: 6379
      targetPort: resp
---
apiVersion: v1
kind: Service
metadata:
  name: distcache-headless
spec:
  clusterIP: None
  publishNotReadyAddresses: true
  selector:
    app.kubernetes.io/component: primary
  ports:
    - name: resp
      port: 6379
      targetPort: resp
